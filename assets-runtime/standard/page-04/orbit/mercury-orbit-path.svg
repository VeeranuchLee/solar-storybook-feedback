  <defs><linearGradient id="orbitLine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7ee9ff" stop-opacity=".22"/><stop offset=".55" stop-color="#a5efff" stop-opacity=".85"/><stop offset="1" stop-color="#ffb23d" stop-opacity=".45"/></linearGradient><filter id="orbitGlow"><feGaussianBlur stdDeviation="3" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <ellipse id="orbit-track" cx="410" cy="220" rx="330" ry="142" fill="none" stroke="url(#orbitLine)" stroke-width="7" stroke-dasharray="10 14" filter="url(#orbitGlow)" transform="rotate(-8 410 220)"/>
  <path id="orbit-direction" d="M665 112c45 25 69 51 79 78" fill="none" stroke="#fff0a2" stroke-width="7" stroke-linecap="round"/><path d="m731 177 15 18 6-22" fill="#fff0a2"/>
