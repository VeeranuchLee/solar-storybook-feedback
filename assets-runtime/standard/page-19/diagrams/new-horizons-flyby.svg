<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img"><title>New Horizons flew past Pluto on 14 July 2015. It did not orbit and did not land. This is a teaching drawing, not a photograph. The craft is enlarged.</title><rect width="720" height="430" rx="28" fill="#071625"/><circle cx="430" cy="268" r="110" fill="#c9844e" stroke="#fff8df" stroke-width="7"/><ellipse cx="400" cy="288" rx="34" ry="38" fill="#efe4c4"/><ellipse cx="444" cy="296" rx="24" ry="28" fill="#e6d3a6"/><circle cx="590" cy="188" r="36" fill="#9a9690" stroke="#fff8df" stroke-width="5"/><ellipse cx="590" cy="160" rx="22" ry="10" fill="#a85a4a"/><path d="M36 148h648" fill="none" stroke="#71d6e9" stroke-width="6" stroke-dasharray="14 12" stroke-linecap="round"/><path d="M660 148l-18-12v24z" fill="#d9853f"/><g transform="translate(150 148)"><g transform="rotate(-12)"><rect x="-40" y="-16" width="80" height="32" rx="6" fill="#f0c36e" stroke="#123e6d" stroke-width="5"/><circle cx="48" r="18" fill="#fff8df" stroke="#123e6d" stroke-width="5"/><rect x="-62" y="-10" width="20" height="20" rx="3" fill="#d9853f" stroke="#123e6d" stroke-width="3"/><path d="M-62-10v-16M-62 10v16" stroke="#d9853f" stroke-width="4" stroke-linecap="round"/></g><animateTransform attributeName="transform" type="translate" begin="indefinite" dur="1.6s" values="150 148;430 148;150 148"/></g><text x="150" y="108" fill="#f0c36e" font-family="Nunito, 'Trebuchet MS', sans-serif" font-size="18" font-weight="800">flyby</text><text x="360" y="404" text-anchor="middle" fill="#f0c36e" font-family="Nunito, 'Trebuchet MS', sans-serif" font-size="20" font-weight="800">Not a landing · not a photograph · craft enlarged</text></svg>
