<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img"><title>Pluto takes about 248 Earth years to go around the Sun on a tilted, stretched-out path. This picture shortens and tips the path; it is not a true map.</title><rect width="720" height="430" rx="28" fill="#071625"/><ellipse cx="360" cy="214" rx="248" ry="92" fill="none" stroke="#8c9aa8" stroke-width="4" stroke-dasharray="7 8" opacity=".55"/><g transform="rotate(-18 360 214)"><ellipse cx="360" cy="214" rx="248" ry="118" fill="none" stroke="#71d6e9" stroke-width="6" stroke-dasharray="12 11"/><circle cx="168" cy="214" r="22" fill="#f0c36e" stroke="#fff8df" stroke-width="5"/><g><circle cx="608" cy="214" r="18" fill="#c9844e" stroke="#fff8df" stroke-width="4"/><ellipse cx="604" cy="220" rx="6" ry="6.5" fill="#efe4c4"/><animateTransform attributeName="transform" type="rotate" begin="indefinite" dur="2.4s" values="0 360 214;360 360 214;0 360 214"/></g></g><text x="360" y="404" text-anchor="middle" fill="#f0c36e" font-family="Nunito, 'Trebuchet MS', sans-serif" font-size="20" font-weight="800">Not a true map · path shortened and tipped</text></svg>
