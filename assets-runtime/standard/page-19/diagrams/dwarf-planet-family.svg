<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img"><title>Five official dwarf planets in order from the Sun: Ceres, Pluto, Haumea, Makemake, and Eris. They are round enough to be balls and have not cleared their neighbourhoods. This family picture is not to scale.</title><rect width="720" height="430" rx="28" fill="#071625"/><circle cx="46" cy="188" r="18" fill="#f0c36e" stroke="#fff8df" stroke-width="4"/><circle cx="126" cy="196" r="34" fill="#8e857b" stroke="#fff8df" stroke-width="5"/><circle cx="140" cy="176" r="8" fill="#fffdf6"/><circle cx="252" cy="188" r="46" fill="#c9844e" stroke="#fff8df" stroke-width="5"/><ellipse cx="236" cy="204" rx="14" ry="16" fill="#efe4c4"/><ellipse cx="260" cy="208" rx="11" ry="12" fill="#e6d3a6"/><ellipse cx="372" cy="196" rx="40" ry="24" fill="#d8cfc2" stroke="#fff8df" stroke-width="5"/><circle cx="492" cy="192" r="32" fill="#c47860" stroke="#fff8df" stroke-width="5"/><circle cx="612" cy="186" r="38" fill="#d5d0c6" stroke="#fff8df" stroke-width="5"/><g fill="#8c9aa8"><ellipse cx="168" cy="132" rx="6" ry="4" transform="rotate(-18 168 132)"/><ellipse cx="214" cy="268" rx="5" ry="3.5"/><ellipse cx="318" cy="126" rx="6" ry="4" transform="rotate(14 318 126)"/><ellipse cx="410" cy="262" rx="5" ry="3"/><ellipse cx="534" cy="128" rx="5" ry="3.5" transform="rotate(-12 534 128)"/><ellipse cx="568" cy="258" rx="6" ry="4"/><ellipse cx="656" cy="250" rx="5" ry="3"/><animate attributeName="opacity" begin="indefinite" dur="1.5s" values="1;.3;1"/></g><text x="126" y="262" text-anchor="middle" fill="#fff8df" font-family="Nunito, 'Trebuchet MS', sans-serif" font-size="16" font-weight="800">Ceres</text><text x="252" y="262" text-anchor="middle" fill="#fff8df" font-family="Nunito, 'Trebuchet MS', sans-serif" font-size="16" font-weight="800">Pluto</text><text x="372" y="262" text-anchor="middle" fill="#fff8df" font-family="Nunito, 'Trebuchet MS', sans-serif" font-size="16" font-weight="800">Haumea</text><text x="492" y="262" text-anchor="middle" fill="#fff8df" font-family="Nunito, 'Trebuchet MS', sans-serif" font-size="16" font-weight="800">Makemake</text><text x="612" y="262" text-anchor="middle" fill="#fff8df" font-family="Nunito, 'Trebuchet MS', sans-serif" font-size="16" font-weight="800">Eris</text><text x="360" y="404" text-anchor="middle" fill="#f0c36e" font-family="Nunito, 'Trebuchet MS', sans-serif" font-size="20" font-weight="800">Not to scale · five official dwarf planets</text></svg>
