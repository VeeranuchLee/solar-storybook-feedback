const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let lastFocus=null,timer;const stage=$('#stage'),status=$('#status');let reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,soundOn=true;function say(t){show(t);if(!soundOn||!window.speechSynthesis)return;speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}function show(t){status.textContent=t;status.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>status.classList.remove('show'),3600)}function poses(a,d){$$('.ari.pose').forEach(x=>x.classList.toggle('active',x.dataset.pose===a));$$('.dot.pose').forEach(x=>x.classList.toggle('active',x.dataset.dot===d))}function playSvg(root){if(reduced)return;root.querySelectorAll('animate,animateTransform,animateMotion').forEach(a=>{try{a.beginElement()}catch{}})}$('#listen').onclick=()=>say('Jupiter is the largest planet. Its bright cloud bands race around a world with the shortest day of any planet.');$('#spin').onclick=()=>{const alt=$('#jupiterAlt').style.opacity==='1';$('#jupiterAlt').style.opacity=alt?'0':'1';$('#jupiterMain').style.opacity=alt?'1':'0';$$('.planet').forEach(x=>x.classList.toggle('spin',!alt));poses('wind','scan');say('Jupiter spins once in about 9.9 hours, the shortest day of any planet.')} ;$('#storm').onclick=()=>{poses('point','storm');$('#stormDetail').classList.add('show');say('The Great Red Spot is a centuries-old storm larger than Earth.');setTimeout(()=>$('#stormDetail').classList.remove('show'),5500)};$('#lights').onclick=()=>{poses('observe','magnetic');$('#aurora').style.opacity='.82';$('#lightning').classList.remove('flash');void $('#lightning').offsetWidth;$('#lightning').classList.add('flash');say('Jupiter has powerful lightning, a huge magnetic field, and glowing auroras near its poles.')};$$('.fact').forEach(b=>{b.onclick=()=>{playSvg(b);say(b.dataset.say)}});
const modal=$('#modal'),outside=[stage];let diagramRequest=0;async function loadDiagram(btn){const request=++diagramRequest;$$('[role=tab]').forEach(x=>x.setAttribute('aria-selected',x===btn));$('#lessonName').textContent=btn.dataset.title;$('#lessonCopy').textContent=btn.dataset.copy;const r=await fetch(`assets-runtime/standard/page-11/diagrams/${btn.dataset.diagram}?v=2`),svg=await r.text();if(request!==diagramRequest)return;$('#diagram').innerHTML=svg;playSvg($('#diagram'))}function openModal(){lastFocus=document.activeElement;modal.classList.add('open');outside.forEach(x=>x.inert=true);loadDiagram($('[role=tab]'));$('#close').focus()}function closeModal(){modal.classList.remove('open');outside.forEach(x=>x.inert=false);lastFocus?.focus()}$('#about').onclick=openModal;$('#close').onclick=closeModal;$$('[role=tab]').forEach(b=>b.onclick=()=>loadDiagram(b));$('#diagram').onclick=()=>playSvg($('#diagram'));modal.onclick=e=>{if(e.target===modal)closeModal()};document.addEventListener('keydown',e=>{if(!modal.classList.contains('open'))return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const f=$$('.dialog button'),i=f.indexOf(document.activeElement);if(e.shiftKey&&i===0){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}});
async function loadFacts(){$$('.fact').forEach(async b=>{const r=await fetch(`assets-runtime/standard/page-11/icons/${b.dataset.icon}?v=4`);b.firstElementChild.innerHTML=await r.text()})}loadFacts();const nav=$('.page-nav'),jump=$('.page-jump'),form=$('.page-goto'),input=form.querySelector('input');let hold,long=false;const openJump=()=>{long=true;form.hidden=false;input.select();input.focus()};jump.onpointerdown=()=>{long=false;hold=setTimeout(openJump,650)};['pointerup','pointercancel','pointerleave'].forEach(t=>jump.addEventListener(t,()=>clearTimeout(hold)));jump.onclick=e=>{if(long)e.preventDefault()};jump.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openJump()}};form.onsubmit=e=>{e.preventDefault();const n=+input.value;if(n>0&&n<15)location.href=`page-${String(n).padStart(2,'0')}.html`};document.addEventListener('pointerdown',e=>{if(!nav.contains(e.target))form.hidden=true});if(reduced)document.body.classList.add('reduced');

/* Name boxes: tap a name, hear the name. Routed through this page's own
   narration helper so the sound toggle and status line keep working.
   The leading semicolon is load-bearing: pages 7-10 end their last statement
   without one, and a following line that opens with `(` is parsed as a call on
   that statement's value -- `classList.add('reduced')(...)` -- which throws and

;(()=>{const plates=[...document.querySelectorAll('.np')];if(!plates.length)return;

:(typeof showStatus==='function'&&typeof speak==='function')?(t=>{showStatus(t);speak(t)})
:(t=>{if(!window.speechSynthesis)return;speechSynthesis.cancel();

plates.forEach(x=>x.classList.toggle('np-on',x===p));clearTimeout(offTimer);

/* Sound and Calm mode. say() is the page's only voice, so gating it there is

   let so the button can move it. */
(()=>{const sb=document.getElementById('sound'),mb=document.getElementById('motion');
