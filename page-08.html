/* SECRETS:CSS */
/* Sparkling stars that hide a space friend, and the sticker book that
   remembers who has been found.

   The trigger is a small glint of light: a child should have to look for it
   rather than be told where it is. The glint and the friend share one position
   and are each centred on it, so a secret is a single point on the page rather
   than two boxes to keep in agreement. */
.sf-star,.sf-friend{position:absolute;transform:translate(-50%,-50%)}
/* A glint, not a picture of a star. This used to show one of the owner's sticker
   sprites at 18px, and at that size the pastel ones -- which have no face -- read
   as a white lump on a photograph of space; several of them also carry
   see-through patches left by the sheet cut, which show as grey smudges on a
   dark sky. The book already had a better answer on Pages 2-4: a small drawn
   sparkle. The sticker art is not lost, it is moved to where it is seen big --
   the friend who pops out, and the sticker book -- and the thing hiding on the
   painting is now a point of light.

   Big invisible button, small mark. Page 6's original sparkle is 70px wide
   holding 25px of star, and that split is the point: a mark small enough to hunt
   for must not mean a target too small for a four-year-old's finger. */
.sf-star{z-index:24;width:44px;height:44px;padding:0;border:0;background:none;
cursor:pointer;display:grid;place-items:center;line-height:0;color:#fff6c8}
/* Deliberately quiet -- the owner's rule is that a child should have to look for
   it. The twinkle is what makes that fair: the glint nearly fades out and comes
   back, so a page scanned patiently gives it away and a page glanced at does not. */
.sf-star::before{content:"✦";line-height:1;
font-size:var(--sf-art,clamp(10px,.9vw,13px));
text-shadow:0 0 3px #ffffffaa,0 0 7px #ffc65eaa;
animation:sfTwinkle 4.6s ease-in-out infinite}
.sf-star:hover::before{text-shadow:0 0 4px #fff,0 0 12px #ffd27a}
.sf-star:focus-visible{outline:3px solid #8eeaff;outline-offset:4px;border-radius:50%}
.sf-star[hidden]{display:none}
@keyframes sfTwinkle{0%,100%{opacity:.2;transform:scale(.72)}
45%{opacity:.92;transform:scale(1.08)}70%{opacity:.34;transform:scale(.85)}}
.sf-friend{z-index:25;pointer-events:none;width:15%;height:21%}
.sf-pop{width:100%;height:100%;opacity:0;transform:translateY(14%) scale(.5);
transition:opacity .38s,transform .52s cubic-bezier(.34,1.56,.64,1)}
.sf-pop img{width:100%;height:100%;object-fit:contain;
filter:drop-shadow(0 8px 16px #000a) drop-shadow(0 0 14px #ffd76a55)}
.sf-friend.sf-here .sf-pop{opacity:1;transform:none}
.sf-friend.sf-going .sf-pop{opacity:0;transform:translateY(-16%) scale(.82)}

/* The sticker book. A child collects across the whole book, so the count is
   kept in localStorage and every page shows the same running total. */
/* The sticker book lives in the page's existing control row rather than
   floating on the picture. Absolutely positioning it meant ten hand-tuned spots
   that still collided -- with a story card at one window size, a fact tray at
   another. In the control row it is laid out in flow, so it cannot collide at
   any size, it is in the place children already look for buttons, and it is in
   the same place on every page. */
.sf-book{position:static;z-index:27;display:inline-flex;align-items:center;gap:.34em;
padding:.26em .62em .26em .34em;border:2px solid #ffd76a;border-radius:999px;
background:#0b1730e8;color:#ffeab5;font:inherit;font-weight:900;
font-size:clamp(8px,.85vw,12px);cursor:pointer;box-shadow:0 3px 12px #0008}
.sf-book:hover{background:#17325a}
/* Let the control row wrap. Several pages lay their row out without wrapping,
   and in portrait it already ran past the edge of the stage before the sticker
   button joined it -- page 6's was 105% of the stage wide. One extra button
   made that visible, so it is fixed here rather than left to overflow. */
.tools,.page-controls,.toolbar{flex-wrap:wrap-reverse;justify-content:flex-end}
/* wrap-reverse, not wrap: these rows are anchored near the bottom of the stage,
   so an overflow line has to go *up* into the sky. Wrapping downwards pushed the
   sticker button off the stage on a phone and onto the rover on Mars. */
.sf-book:focus-visible{outline:3px solid #8eeaff;outline-offset:3px}
.sf-book img{width:1.5em;height:1.5em;object-fit:contain}
.sf-book.sf-pulse{animation:sfPulse .7s ease-out}
@keyframes sfPulse{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.sf-panel{position:absolute;z-index:70;inset:6% 8%;display:none;flex-direction:column;
padding:14px 16px;border:2px solid #ffd76a;border-radius:22px;background:#07152df7;
box-shadow:0 18px 50px #000d;backdrop-filter:blur(6px)}
.sf-panel.sf-open{display:flex}
.sf-panel h2{margin:0 0 2px;color:#ffd76a;font-size:clamp(13px,1.5vw,20px)}
.sf-panel p{margin:0 0 10px;color:#bdd8f0;font-size:clamp(8px,.9vw,12px)}
.sf-grid{flex:1;display:grid;gap:6px;overflow:auto;
grid-template-columns:repeat(auto-fill,minmax(52px,1fr));align-content:start}
.sf-slot{position:relative;aspect-ratio:1;border-radius:12px;background:#0d1c34;
display:grid;place-items:center;padding:5px}
.sf-slot img{width:100%;height:100%;object-fit:contain}
.sf-slot.sf-locked img{filter:brightness(0) opacity(.32)}
.sf-slot.sf-got{background:#16345c;box-shadow:inset 0 0 0 2px #ffd76a}
.sf-close{position:absolute;right:10px;top:10px;width:32px;height:32px;border:0;
border-radius:50%;background:#ffd76a;color:#07152d;font-weight:1000;font-size:16px;cursor:pointer}
.reduced .sf-star::before,.reduce-motion .sf-star::before,
.stage.reduced .sf-star::before,.stage.reduce-motion .sf-star::before{animation:none;opacity:.85}
.reduced .sf-pop,.reduce-motion .sf-pop,
.stage.reduced .sf-pop,.stage.reduce-motion .sf-pop{transition:opacity .18s}
@media(prefers-reduced-motion:reduce){.sf-star::before{animation:none;opacity:.85}}
@media(max-aspect-ratio:4/5){.sf-star{width:40px;height:40px;--sf-art:clamp(10px,2.8vw,13px)}
.page-controls{max-width:56%}
/* Page 5 and 6 lay their portrait control row out 105% of the stage wide, so it
   already ran off both edges before the sticker button existed. Constraining it
   makes it wrap inside the stage, which is what made the button reachable on a
   phone at all. */
.tools{max-width:96%;right:2%}
.sf-friend{width:18%;height:13%}.sf-panel{inset:4% 4%}}

const qb=$("#quality"),sync=()=>{qb.textContent=tier==='high'?'✦ Sharper':'✦ Standard';qb.setAttribute('aria-pressed',tier==='high')};if(tier==='high'){tier='standard';highReady().then(ok=>{if(ok){tier='high';retier()}else try{localStorage.removeItem('sb-quality')}catch(e){}sync()})}qb.onclick=async()=>{if(tier==='high'){tier='standard';try{localStorage.setItem('sb-quality',tier)}catch(e){}retier();sync();return}qb.disabled=true;const ok=await highReady();qb.disabled=false;if(!ok){qb.textContent='✦ Standard only';setTimeout(sync,2600);return}tier='high';try{localStorage.setItem('sb-quality',tier)}catch(e){}retier();sync()};sync();const fs=$("#fullscreen");if(!document.documentElement.requestFullscreen)fs.hidden=true;else fs.onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();const jump=$(".page-jump"),form=$(".page-goto"),input=form.querySelector('input');let hold;const open=()=>{form.hidden=false;input.select();input.focus()};jump.onpointerdown=()=>hold=setTimeout(open,650);['pointerup','pointercancel','pointerleave'].forEach(t=>jump.addEventListener(t,()=>clearTimeout(hold)));jump.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};form.onsubmit=e=>{e.preventDefault();const n=+input.value;if(n>0&&n<17)location.href=`page-${String(n).padStart(2,'0')}.html`};if(reduced)stage.classList.add('reduced')




/* NAMEPLATES:JS */
/* Name boxes: tap a name, hear the name. Routed through this page's own
   narration helper so the sound toggle and status line keep working.
   The leading semicolon is load-bearing: pages 7-10 end their last statement
   without one, and a following line that opens with `(` is parsed as a call on
   that statement's value -- `classList.add('reduced')(...)` -- which throws and
   silently takes this whole block with it. The boxes still looked right and
   simply never spoke. */
;(()=>{const plates=[...document.querySelectorAll('.np')];if(!plates.length)return;
const tell=(typeof say==='function')?say
:(typeof showStatus==='function'&&typeof speak==='function')?(t=>{showStatus(t);speak(t)})
:(t=>{if(!window.speechSynthesis)return;speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(t);u.rate=.92;u.pitch=1.06;speechSynthesis.speak(u)});
let offTimer;plates.forEach(p=>p.addEventListener('click',()=>{
plates.forEach(x=>x.classList.toggle('np-on',x===p));clearTimeout(offTimer);
offTimer=setTimeout(()=>p.classList.remove('np-on'),2600);
tell(p.dataset.say||p.querySelector('.np-name').textContent)}))})();

/* SECRETS:JS */
/* Sparkling stars and the sticker book. Speech goes through the page's own
   helper so the Sound toggle keeps working; one friend at a time so taps cannot
   stack; the collection is shared across the whole book via localStorage. */
;(()=>{const stars=[...document.querySelectorAll('.sf-star')];if(!stars.length)return;
const tell=(typeof say==='function')?say
:(typeof showStatus==='function'&&typeof speak==='function')?(t=>{showStatus(t);speak(t)})
:(typeof showFact==='function'&&typeof speakRole==='function')?(t=>{showFact(t);speakRole(t)})
:(t=>{if(!window.speechSynthesis)return;speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(t);u.rate=.95;u.pitch=1.25;speechSynthesis.speak(u)});
/* A two-note plink, made rather than loaded: it needs no asset, no licence and
   no download, and it is the same trick page 2 already uses for its chime. */
let actx;const plink=()=>{try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
actx=actx||new A();if(actx.state==='suspended')actx.resume();
[[880,0],[1320,.09]].forEach(([f,t])=>{const o=actx.createOscillator(),g=actx.createGain();
o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,actx.currentTime+t);
g.gain.exponentialRampToValueAtTime(.16,actx.currentTime+t+.015);
g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t+.28);
o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.3)})}catch(e){}};

const KEY='sb-stickers';
const load=()=>{try{return new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){return new Set()}};
const save=set=>{try{localStorage.setItem(KEY,JSON.stringify([...set]))}catch(e){}};
let got=load();
const book=document.querySelector('.sf-book'),tally=book&&book.querySelector('.sf-tally');
/* Prefer .page-controls: on pages 11-14 that is the utility row, while .tools
   there holds the page's own discovery buttons. On pages 5-10 .tools *is* the
   utility row. Asked for in one selector list this picks whichever comes first
   in the document, not the one wanted -- page 12 got its empty .tools and the
   book vanished -- so they are tried in order, and a zero-sized row is skipped. */
const host=['.page-controls','.tools','.toolbar'].map(q=>document.querySelector(q))
 .find(el=>el&&el.getBoundingClientRect().width>10);
if(book&&host)host.appendChild(book);
const syncBook=()=>{if(tally)tally.textContent=`${got.size} / ${SF_ROSTER.length}`};

const panel=document.querySelector('.sf-panel'),grid=panel&&panel.querySelector('.sf-grid');
const paint=()=>{if(!grid)return;grid.innerHTML=SF_ROSTER.map(f=>{
const has=got.has(f.id);
return `<div class="sf-slot ${has?'sf-got':'sf-locked'}" title="${has?f.name:'Still hidden'}">`+
`<img src="${SF_ART}/${f.art}.webp" alt="${has?f.name:'A sticker still to find'}"></div>`}).join('')};
const outside=()=>[...panel.parentElement.children].filter(x=>x!==panel);
if(book){book.addEventListener('click',()=>{paint();panel.classList.add('sf-open');
outside().forEach(x=>x.inert=true);panel.querySelector('.sf-close').focus()})}
if(panel){const shut=()=>{panel.classList.remove('sf-open');outside().forEach(x=>x.inert=false);
if(book)book.focus()};panel.querySelector('.sf-close').onclick=shut;
addEventListener('keydown',e=>{if(e.key==='Escape'&&panel.classList.contains('sf-open'))shut()})}

let busy=false,timers=[];
let total=stars.filter(s=>s.offsetParent!==null).length;
addEventListener('resize',()=>{if(!busy)total=stars.filter(s=>s.offsetParent!==null).length});
stars.forEach(star=>star.addEventListener('click',()=>{
if(busy)return;busy=true;const id=star.dataset.friend;
const friend=document.getElementById(id);star.hidden=true;
friend.classList.remove('sf-going');friend.classList.add('sf-here');
plink();
if(!got.has(star.dataset.sticker)){got.add(star.dataset.sticker);save(got);syncBook();
if(book){book.classList.remove('sf-pulse');void book.offsetWidth;book.classList.add('sf-pulse')}}
tell(star.dataset.say);
timers.forEach(clearTimeout);timers=[
 setTimeout(()=>friend.classList.add('sf-going'),3600),
 setTimeout(()=>{friend.classList.remove('sf-here','sf-going');star.hidden=false;busy=false},4400)]}));
syncBook()})();
/* /SECRETS:JS */
})();

/* Hide the picture-quality control unless the sharper tier is really there.
   It is sidecar-only and unpublished, so on the live site it would otherwise be
   a button that can only ever say "Standard only". Same rule the fullscreen
   button already follows. The probe costs one 404 and re-shows the control the
   moment the tier exists. */
;(()=>{const q=document.getElementById('quality');if(!q)return;
const el=document.querySelector('img[src*="assets-runtime/"]');if(!el){q.hidden=true;return}
const im=new Image();im.onerror=()=>{q.hidden=true};
im.src=el.getAttribute('src').replace(/assets-runtime\/(standard|high)\//,'assets-runtime/high/')})();
