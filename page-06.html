<script>
(()=>{
/* Runtime asset tiers. assets/ holds the masters and is never loaded by a page;
   assets-runtime/{standard,high}/ hold the derivatives -- identical trees apart
   from one path segment, so changing tier is a path swap. The markup ships
   standard/, so the default costs no JS at all. rt() maps a master path onto
   the ACTIVE tier for the handful of paths this page builds at runtime, and
   retier() re-points what is already in the DOM when the tier changes. */
let rtTier="standard";try{if(localStorage.getItem("sb-quality")==="high")rtTier="high"}catch(e){}
const rt=p=>(p=String(p),p.startsWith("assets-runtime/")?p.replace(/^assets-runtime\/(standard|high)\//,"assets-runtime/"+rtTier+"/"):"assets-runtime/"+rtTier+"/"+p.replace(/^assets\//,"").replace(/\.png$/i,".webp"));
const retier=()=>{const s=x=>x.replace(/assets-runtime\/(standard|high)\//g,"assets-runtime/"+rtTier+"/");document.querySelectorAll("img[src]").forEach(i=>{const o=i.getAttribute("src"),n=s(o);if(n!==o)i.setAttribute("src",n)});document.querySelectorAll("[style*='assets-runtime/']").forEach(e=>{const o=e.getAttribute("style"),n=s(o);if(n!==o)e.setAttribute("style",n)});document.querySelectorAll("style").forEach(e=>{const o=e.textContent;if(o.indexOf("assets-runtime/")<0)return;const n=s(o);if(n!==o)e.textContent=n})};
/* The high tier is not always there. `assets-runtime/high/` is sidecar-only and
   the public export ships standard alone, so "Sharper" used to repoint every
   path at a tier with no files behind it and break every image on the page --
   and localStorage kept the reader there across pages and sessions, so one tap
   left a child with a broken book until they happened to tap back. Probe one
   real asset before committing to the tier, and treat a STORED "high" the same
   way, which is what rescues anyone already stranded by an older build.
   Deliberately not a preload of the whole tier: one image answers the only
   question that matters, and a miss costs one 404. */
const probeHigh=()=>new Promise(res=>{const el=document.querySelector('img[src*="assets-runtime/"]');if(!el)return res(false);const im=new Image();im.onload=()=>res(true);im.onerror=()=>res(false);im.src=el.getAttribute("src").replace(/assets-runtime\/(standard|high)\//,"assets-runtime/high/")});
let highTier=null;const highReady=async()=>{if(highTier===null)highTier=await probeHigh();return highTier};
const forgetTier=()=>{try{localStorage.removeItem("sb-quality")}catch(e){}};
if(rtTier==="high"){rtTier="standard";highReady().then(ok=>{if(ok){rtTier="high";retier()}else forgetTier();syncQuality()})}
/* Narration. One MP3 per line under assets/audio/page-06/, keyed by the exact
   line text -- which is why no call site changed. narrate() returns false on
   a miss and the caller falls through to speechSynthesis, so a line without a
   clip behaves exactly as before. The map is inlined, not fetched, because
   these pages are opened over file:// where fetch is blocked.
   NOTE: rendered via the unofficial edge backend -- re-render through
   --backend azure before publishing (see assets-manifest.json provenance). */
const NARRATION={};
const NARRATION_BASE="assets/audio/page-06/";
let narrationAudio=null,narrationToken=0;
const stopNarration=()=>{try{if(narrationAudio){narrationToken++;narrationAudio.onended=null;narrationAudio.onerror=null;narrationAudio.pause()}}catch(e){}};
const narrate=(text,onend,fallback)=>{const f=NARRATION[String(text).trim()];if(!f)return false;try{stopNarration();if(!narrationAudio)narrationAudio=new Audio();const my=++narrationToken;const fail=()=>{if(my!==narrationToken)return;narrationToken++;narrationAudio.onended=null;narrationAudio.onerror=null;(fallback||onend||(()=>{}))()};narrationAudio.onended=()=>{if(my===narrationToken&&onend)onend()};narrationAudio.onerror=fail;narrationAudio.src=NARRATION_BASE+f;const p=narrationAudio.play();if(p&&p.catch)p.catch(fail);return true}catch(e){return false}};
const syncQuality=()=>{const b=document.getElementById("quality");if(!b)return;b.textContent=rtTier==="high"?"✦ Sharper":"✦ Standard";b.setAttribute("aria-pressed",String(rtTier==="high"))};
const qb=document.getElementById("quality");if(qb)qb.onclick=async()=>{if(rtTier==="high"){rtTier="standard";try{localStorage.setItem("sb-quality",rtTier)}catch(e){}retier();syncQuality();return}qb.disabled=true;const ok=await highReady();qb.disabled=false;if(!ok){forgetTier();qb.textContent="✦ Standard only";qb.title="Sharper pictures are not included in this build";setTimeout(()=>{qb.removeAttribute("title");syncQuality()},2600);return}rtTier="high";try{localStorage.setItem("sb-quality",rtTier)}catch(e){}retier();syncQuality()};
syncQuality();
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const stage=$('#stage'),earth=$('#earth'),panel=$('#lessonPanel'),parade=$('#parade'),status=$('#status');let soundOn=true,reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,timer;
let statusTimer;const showStatus=(text,ms=4200)=>{clearTimeout(statusTimer);status.textContent=text;statusTimer=setTimeout(()=>{status.textContent=''},ms)};const say=text=>{showStatus(text);if(!soundOn)return;const synth=()=>{if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.95;u.pitch=1.06;speechSynthesis.speak(u)}};if(narrate(text,null,synth))return;synth()};const stop=()=>{clearTimeout(timer);panel.className='lesson-panel';parade.className='parade';earth.className='earth';$$('.lesson').forEach(x=>x.classList.remove('on'))};const pose=id=>{$$('.characters img').forEach(x=>x.classList.toggle('on',x.id===id))};
const lessons={ocean:{title:"Earth's connected ocean",img:rt('assets/page-06/teaching/ocean-depth.png'),text:'Ocean covers about 71% of Earth. Shallow and deep water join one connected ocean.',pose:'poseOcean'},clouds:{title:'Weather on the move',img:rt('assets/page-06/teaching/water-cycle.svg'),text:'Wind carries clouds. Water rises, forms clouds, falls as rain, and returns to the ocean.',pose:'poseOcean'},atmosphere:{title:'A thin blanket of air',img:rt('assets/page-06/teaching/atmosphere-protection.svg'),text:"Earth's atmosphere is mostly nitrogen and oxygen. It gives us air and helps protect life.",pose:'poseAir'}};
$$('.lesson').forEach(b=>b.onclick=()=>{stop();const d=lessons[b.dataset.lesson];b.classList.add('on');earth.classList.add(b.dataset.lesson==='atmosphere'?'air':b.dataset.lesson);panel.querySelector('h2').textContent=d.title;panel.querySelector('.lesson-base').src=d.img;panel.querySelector('.lesson-base').alt=d.title;panel.querySelector('p').textContent=d.text;panel.className=`lesson-panel open ${b.dataset.lesson}`;pose(d.pose);say(d.text);timer=setTimeout(()=>{stop();pose('poseObserve')},7000)});panel.querySelector('.close').onclick=()=>{stop();pose('poseObserve')};
const groups={living:{title:'Living fliers',files:['birds-v1.png','butterfly-v1.png','bee-v1.png'],wingFrames:['birds-wingbeat-v2.png','butterfly-wingbeat-v2.png','bee-wingbeat-v2.png'],alts:['Birds','Butterfly','Bee'],voice:"Birds, butterflies, and bees use Earth's air to fly."},people:{title:'People in the sky',files:['passenger-airplane-v1.png','helicopter-v1.png','hot-air-balloon-v1.png'],alts:['Passenger airplane','Helicopter','Hot-air balloon'],voice:'Airplanes, helicopters, and hot-air balloons carry people through the sky.'},explorers:{title:'Sky explorers',files:['weather-balloon-v1.png','research-drone-v1.png','hang-glider-v1.png'],alts:['Weather balloon','Research drone','Hang glider'],voice:"Weather balloons, research drones, and hang gliders help us explore Earth's air."}};
$$('.secret').forEach(b=>b.onclick=()=>{stop();const d=groups[b.dataset.parade],slots=$$('.flyer');parade.className=`parade open ${b.dataset.parade}`;parade.querySelector('h2').textContent=d.title;slots.forEach((slot,i)=>{const base=slot.querySelector('.base'),alt=slot.querySelector('.alt');base.src=rt("assets/page-06/sky-parade/"+d.files[i]);base.alt=d.alts[i];alt.alt='';if(d.wingFrames){alt.src=rt("assets/page-06/sky-parade/"+d.wingFrames[i]);alt.hidden=false}else{alt.removeAttribute('src');alt.hidden=true}});say(d.voice);timer=setTimeout(stop,7000)});parade.querySelector('.close').onclick=stop;
$$('.fact').forEach(b=>b.onclick=()=>{$$('.fact').forEach(x=>x.classList.toggle('on',x===b));if(!reduced)b.querySelectorAll('animate,animateTransform').forEach(a=>a.beginElement());say(b.dataset.say)});
$('#about').onclick=()=>say('Earth is a blue ocean world wrapped in a thin atmosphere. It is the only world where life has been confirmed.');$('#listen').onclick=()=>say('Earth is a blue ocean world with moving clouds, land, ice, and a thin atmosphere. It is the only world where life has been confirmed.');$('#sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊 Sound':'🔇 Muted';if(!soundOn){stopNarration();speechSynthesis?.cancel()}};$('#motion').onclick=e=>{reduced=!reduced;stage.classList.toggle('reduced',reduced);e.currentTarget.textContent=reduced?'▶ Motion':'⏸ Motion'};$('#replay').onclick=()=>{stop();pose('poseObserve');$$('.fact').forEach(x=>x.classList.remove('on'));clearTimeout(statusTimer);status.textContent='';stopNarration();speechSynthesis?.cancel()};/* Shared hold-to-jump, identical to pages 1-5. Replaces a browser prompt(),
   which was unstyled, unusable on some kiosk/embedded browsers and diverged
   from the inline field every other page already used. */
(()=>{const nav=document.querySelector(".page-nav"),jump=nav.querySelector(".page-jump"),form=nav.querySelector(".page-goto"),input=form.querySelector("input");let timer=0,longPress=false;const open=()=>{longPress=true;form.hidden=false;input.select();input.focus()};jump.addEventListener("pointerdown",()=>{longPress=false;timer=setTimeout(open,650)});["pointerup","pointercancel","pointerleave"].forEach(t=>jump.addEventListener(t,()=>clearTimeout(timer)));jump.addEventListener("click",e=>{if(longPress)e.preventDefault()});jump.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}});jump.addEventListener("contextmenu",e=>{e.preventDefault();open()});form.addEventListener("submit",e=>{e.preventDefault();const page=Number(input.value);if(page<1||page>9)return;try{speechSynthesis.cancel()}catch(err){}location.href=`page-${String(page).padStart(2,"0")}.html`});document.addEventListener("pointerdown",e=>{if(!nav.contains(e.target))form.hidden=true})})();if(reduced)stage.classList.add('reduced');})();

/* Shared fullscreen toggle, ported from page 1 so every page has it. Fails
   safe: the control hides itself where the API is unavailable or blocked
   (older iOS Safari, some embedded webviews) rather than dead-clicking. */
(()=>{const b=document.getElementById("fullscreen");if(!b)return;const t=document.documentElement;if(!t.requestFullscreen){b.hidden=true;return}b.addEventListener("click",()=>{if(document.fullscreenElement)document.exitFullscreen();else t.requestFullscreen().catch(()=>{})});})();
</script></body></html>
