  <style>
  /* Touch hygiene -- owner 2026-09-15: a child's drag became a blue text selection,
     and pinches zoomed the page. user-select and touch-callout stop the first;
     touch-action: manipulation stops double-tap zoom without killing scroll. Pinch
     itself needs the gesturestart guard below, because iOS ignores user-scalable=no. */
  html { -webkit-text-size-adjust: 100%; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
  input, textarea, [contenteditable="true"] { -webkit-user-select: text; user-select: text; }

  <script>
  /* Pinch-zoom guard. iOS Safari ignores user-scalable=no (since iOS 10), so this is
     the only thing that stops two small hands zooming the page mid-play. gesturestart
     fires once per pinch; preventing it cancels the zoom and touches nothing else.
